
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Proyecto Pokémon</title>

    <link rel="stylesheet" href="Css/index.css">
</head>

<body>

    <div class="container principal">

        <h1>💙 Mi Pokédex</h1>

        <p class="subtitulo">
            Explora y consulta información de diferentes fuentes
        </p>

        <div class="botones">

            <a href="#" id="txtBtn" class="button">
                📄 Cargar TXT
            </a>

            <a href="#" id="jsonBtn" class="button">
                📋 Cargar JSON
            </a>

            <a href="#" id="apiBTN" class="button">
                🌐 Cargar API
            </a>

            <a href="#" id="pokemonBtn" class="button">
                ⚡ Cargar Pokémon
            </a>

        </div>

    </div>

    <div class="container resultados">

        <h2>✨ Resultados</h2>

        <div id="resultado">
            <p class="mensaje">
                Selecciona una opción para visualizar la información aquí.
            </p>
        </div>

    </div>

    <script src="Js/app.js"></script>

</body>
</html>
